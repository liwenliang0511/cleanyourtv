name: Build Xiaomi compatible entry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Build compatible entry and opt-in home redirect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compat/src/com/gathin/tvhome/bridge compat/res/mipmap-xhdpi compat/res/drawable-nodpi compat/res/xml compat/res/values compat/classes compat/dex artifact
          cat > compat/AndroidManifest.xml <<'SOURCE_AndroidManifest'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.gathin.tvhome.bridge">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <queries><package android:name="com.gathin.tvhome" /></queries>
              <application android:label="CleanYourTV" android:icon="@mipmap/ic_launcher" android:banner="@drawable/banner" android:allowBackup="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".HomeRedirectService" android:label="CleanYourTV 开机与Home键" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/home_redirect" />
                  </service>
              </application>
          </manifest>
          SOURCE_AndroidManifest
          cat > compat/src/com/gathin/tvhome/bridge/MainActivity.java <<'SOURCE_MainActivity'
          package com.gathin.tvhome.bridge;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.util.Log;
          import android.widget.Toast;
          
          public final class MainActivity extends Activity {
              static boolean openHome(Context context) {
                  try {
                      context.startActivity(new Intent(Intent.ACTION_MAIN)
                          .setComponent(new ComponentName("com.gathin.tvhome", "com.gathin.tvhome.MainActivity"))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED));
                      Log.i("CleanYourTVBridge", "Requested CleanYourTV launch");
                      return true;
                  } catch (RuntimeException error) {
                      Log.e("CleanYourTVBridge", "Could not open CleanYourTV", error);
                      return false;
                  }
              }
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (!openHome(this)) {
                      Toast.makeText(this, "请先安装 CleanYourTV 主屏幕", Toast.LENGTH_LONG).show();
                  }
                  finish();
              }
          }
          SOURCE_MainActivity
          cat > compat/src/com/gathin/tvhome/bridge/HomeRedirectService.java <<'SOURCE_HomeRedirectService'
          package com.gathin.tvhome.bridge;
          
          import android.accessibilityservice.AccessibilityService;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          
          /** Only observes stock home window identity. Does not request screen content or key events. */
          public final class HomeRedirectService extends AccessibilityService {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private long lastLaunch = -5000;
          
              private void openHome() {
                  if (!getSystemService(PowerManager.class).isInteractive()) return;
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastLaunch < 2000) return;
                  lastLaunch = now;
                  MainActivity.openHome(this);
              }
          
              @Override protected void onServiceConnected() {
                  Log.i("CleanYourTVBridge", "Home redirect service connected");
                  boolean first = getSharedPreferences("home", MODE_PRIVATE).getBoolean("first", true);
                  getSharedPreferences("home", MODE_PRIVATE).edit().putBoolean("first", false).apply();
                  // One launch at initial opt-in / boot; no polling or repeated foreground service.
                  if (first || SystemClock.elapsedRealtime() < 180000) {
                      handler.postDelayed(this::openHome, 2000);
                  }
              }
          
              @Override public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  if (!"com.mitv.tvhome".contentEquals(event.getPackageName() == null ? "" : event.getPackageName())) return;
                  if (!"com.mitv.tvhome.MainActivityUserMode".contentEquals(event.getClassName() == null ? "" : event.getClassName())) return;
                  Log.i("CleanYourTVBridge", "Stock home window detected");
                  openHome();
              }
          
              @Override public void onInterrupt() { }
              @Override public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }
          }
          SOURCE_HomeRedirectService
          cat > compat/res/xml/home_redirect.xml <<'SOURCE_home_redirect'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:packageNames="com.mitv.tvhome"
              android:notificationTimeout="300"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_description" />
          SOURCE_home_redirect
          cat > compat/res/values/strings.xml <<'SOURCE_strings'
          <resources>
              <string name="service_description">检测小米主桌面出现并打开 CleanYourTV。仅识别主桌面的应用与窗口名称，不读取屏幕文字、不联网、不拦截按键、不处理屏保。关闭此服务可恢复小米 Home 键行为。</string>
          </resources>
          SOURCE_strings
          cp launcher/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg compat/res/mipmap-xhdpi/
          cp launcher/app/src/main/res/drawable-nodpi/banner.jpg compat/res/drawable-nodpi/
          SDK=/usr/local/lib/android/sdk
          BT="$SDK/build-tools/34.0.0"
          JAR="$SDK/platforms/android-34/android.jar"
          "$BT/aapt2" compile --dir compat/res -o compat/res.zip
          "$BT/aapt2" link -I "$JAR" --manifest compat/AndroidManifest.xml --version-code 2 --version-name 2.0 -o compat/unsigned.apk compat/res.zip
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$JAR" -d compat/classes compat/src/com/gathin/tvhome/bridge/*.java
          "$BT/d8" --lib "$JAR" --min-api 26 --output compat/dex compat/classes/com/gathin/tvhome/bridge/*.class
          zip -j compat/unsigned.apk compat/dex/classes.dex
          "$BT/zipalign" -p -f 4 compat/unsigned.apk compat/aligned.apk
          keytool -genkeypair -keystore compat/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks compat/debug.keystore --ks-pass pass:android --key-pass pass:android --out artifact/CleanYourTV-Entry.apk compat/aligned.apk
          "$BT/apksigner" verify --verbose artifact/CleanYourTV-Entry.apk
          "$BT/aapt2" dump badging artifact/CleanYourTV-Entry.apk
          (cd artifact && sha256sum CleanYourTV-Entry.apk > SHA256SUMS.txt)
          cp compat/*.xml artifact/
          cp compat/src/com/gathin/tvhome/bridge/*.java artifact/
          printf '\nAPK_BASE64_BEGIN\n'
          base64 -w 76 artifact/CleanYourTV-Entry.apk
          printf '\nAPK_BASE64_END\n'
          cat artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CleanYourTV-compatible-entry
          path: artifact/
          if-no-files-found: error
          retention-days: 14
