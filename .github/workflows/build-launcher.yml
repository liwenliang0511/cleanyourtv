name: Build Launcher APK only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK and run existing unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK and prepare artifact
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p ../artifact
          cp app/build/outputs/apk/release/app-release.apk ../artifact/CleanYourTV-2.2.apk
          cd ../artifact
          sha256sum CleanYourTV-2.2.apk > SHA256SUMS.txt
          printf 'Source commit: %s\n' "$GITHUB_SHA" > BUILD.txt
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CleanYourTV-Launcher-APK
          path: artifact/
          if-no-files-found: error
          retention-days: 14
